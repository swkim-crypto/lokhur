  {id:"sub",   nm:"변전소 6,70 × 15,0 m",     c:"#8a5cd6", on:false},
  {id:"datum", nm:"표고 충돌 평면",      c:"#d9822b", on:false}
];
var MODES = [
  {id:"plan", nm:"평면도 기준"},
  {id:"both", nm:"조서 치수 중첩"},
  {id:"sect", nm:"단면"},
  {id:"dat",  nm:"표고 충돌"}
];
var STATE = {mode:"plan", lay:{}, cut:1, ev:null};
LAYERS.forEach(function(l){ STATE.lay[l.id]=l.on; });

(function(){
  var mb=document.getElementById('modeBar');
  MODES.forEach(function(m){
    var b=document.createElement('button');
    b.textContent=m.nm; b.dataset.m=m.id;
    if(m.id===STATE.mode) b.className='on';
    b.onclick=function(){ setMode(m.id); };
    mb.appendChild(b);
  });
  var ec=document.getElementById('evs');
  EV.forEach(function(e,i){
    var d=document.createElement('div');
    d.className='ev'+(e.warn?' warn':'');
    d.innerHTML='<span class="v">'+e.lab+'</span><span class="l">'+e.src+'</span>';
    d.onclick=function(){
      STATE.ev=(STATE.ev===i?null:i);
      [].forEach.call(ec.children,function(c,j){
        c.className=c.className.replace(/ on\b/,'')+(j===STATE.ev?' on':''); });
      if(VIEW) VIEW.plane(STATE.ev===null?null:e);
    };
    ec.appendChild(d);
  });
  var lc=document.getElementById('lays');
  LAYERS.forEach(function(l){
    var w=document.createElement('label'); w.className='lay';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=l.on;
    var sw=document.createElement('span'); sw.className='sw'; sw.style.background=l.c;
    var tx=document.createElement('span'); tx.textContent=l.nm;
    cb.onchange=function(){ STATE.lay[l.id]=cb.checked; if(VIEW) VIEW.sync(); };
    w.appendChild(cb); w.appendChild(sw); w.appendChild(tx); lc.appendChild(w);
  });
  document.getElementById('cut').oninput=function(){
    STATE.cut=this.value/100; if(VIEW) VIEW.cut(STATE.cut); };
  var ic=document.getElementById('issues');
  ISSUES.forEach(function(o){
    if(o.sec){ var g=document.createElement('div'); g.className='grp'; g.textContent=o.sec; ic.appendChild(g); return; }
    var d=document.createElement('div'); d.className='iss '+o.k;
    d.innerHTML='<div class="hd"><span class="no">'+o.n+'</span><span class="t">'+o.t+'</span>'
      +'<span class="st">'+o.st+'</span></div><div class="bd">'+o.d+'</div>';
    d.onclick=function(){
      var open=d.className.indexOf('open')>=0;
      [].forEach.call(ic.querySelectorAll('.iss'),function(x){x.className=x.className.replace(/ open\b/,'');});
      if(!open){ d.className+=' open'; if(VIEW&&o.cam) VIEW.fly(o.cam); }
    };
    ic.appendChild(d);
  });
})();

function setMode(m){
  STATE.mode=m;
  [].forEach.call(document.getElementById('modeBar').children,function(b){
    b.className=(b.dataset.m===m)?'on':''; });
  var set={
    plan:{main:1,brief:0,pump:1,suct:1,disc:1,avan:1,sub:0,datum:0},
    both:{main:1,brief:1,pump:1,suct:0,disc:0,avan:1,sub:1,datum:0},
    sect:{main:1,brief:0,pump:1,suct:1,disc:1,avan:0,sub:0,datum:0},
    dat: {main:1,brief:0,pump:0,suct:0,disc:0,avan:0,sub:1,datum:1}
  }[m];
  LAYERS.forEach(function(l){ STATE.lay[l.id]=!!set[l.id]; });
  [].forEach.call(document.getElementById('lays').children,function(w,i){
    w.firstChild.checked=STATE.lay[LAYERS[i].id]; });
  if(m==='sect'){ STATE.cut=.5; document.getElementById('cut').value=50; }
  else { STATE.cut=1; document.getElementById('cut').value=100; }
  if(VIEW){ VIEW.sync(); VIEW.cut(STATE.cut); }
}
</script>

<script src="../assets/three.min.js"></script>

<script>
/* ═══ C. 3D 장면 ═════════════════════════════════════════════
   X = 종방향(축①→②) / Z = 횡방향 / Y = 표고. 단위 m.
   0 = ТХ 양수장 평면도 ±0.000.                                */
(function(){
try{
  var host=document.getElementById('mid');
  var W=host.clientWidth||800, H=host.clientHeight||600;
  var scene=new THREE.Scene(); scene.background=new THREE.Color(0xe8e5dd);
  var camera=new THREE.PerspectiveCamera(42, W/H, .5, 2000);
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(W,H); renderer.localClippingEnabled=true;
  host.insertBefore(renderer.domElement, host.firstChild);
  scene.add(new THREE.AmbientLight(0xffffff,.72));
  var dl=new THREE.DirectionalLight(0xffffff,.55); dl.position.set(30,50,25); scene.add(dl);
  var dl2=new THREE.DirectionalLight(0xffffff,.25); dl2.position.set(-25,20,-20); scene.add(dl2);

  var P = SITE;                       // 평면도 판독값
  var N = {
    L:P.planL, W:P.planW, floor:-2.60, eave:5.20, ridge:7.30, wall:.40,
    seg:P.segs, inner:[3.0,11.15,2.93], crossSeg:[1.65,3.0,1.65],
    pump:[4.50,7.50,10.50,13.50], axisZ:2.70
  };
  var G={}; LAYERS.forEach(function(l){ G[l.id]=new THREE.Group(); scene.add(G[l.id]); });
  var clip=new THREE.Plane(new THREE.Vector3(-1,0,0),100);
  renderer.clippingPlanes=[clip];

  function mat(c,o,side){
    return new THREE.MeshLambertMaterial({color:c,transparent:o<1,opacity:o,
      depthWrite:o>=.7, side:side||THREE.FrontSide, clippingPlanes:[clip]});
  }
  function line(c,o){
    return new THREE.LineBasicMaterial({color:c,transparent:o<1,
      opacity:o===undefined?1:o, clippingPlanes:[clip]});
  }
  function box(w,h,d,x,y,z,m,g,ec){
    var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.set(x,y,z); g.add(b);
    var e=new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry), line(ec===undefined?0x23272e:ec,.5));
    e.position.copy(b.position); g.add(e); return b;
  }
  function pipe(r,len,x,y,z,rot,m,g){
    var p=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,18,1,true),m);
    p.position.set(x,y,z);
    if(rot==='x') p.rotation.z=Math.PI/2;
    if(rot==='z') p.rotation.x=Math.PI/2;
    g.add(p); return p;
  }

  /* 양수장 본체 — ТХ 평면도 17.88 × 5.40 */
  (function(){
    var g=G['main'], m=mat(0xf4f2ec,.40,THREE.DoubleSide), hz=N.W/2, hw=N.eave-N.floor;
    box(N.L,.3,N.W, N.L/2, N.floor-.15, 0, mat(0xd8d4c8,.9), g);
    box(N.L,hw,N.wall, N.L/2, N.floor+hw/2, -hz, m, g);
    box(N.L,hw,N.wall, N.L/2, N.floor+hw/2,  hz, m, g);
    box(N.wall,hw,N.W, 0,   N.floor+hw/2, 0, m, g);
    box(N.wall,hw,N.W, N.L, N.floor+hw/2, 0, m, g);
    var sh=new THREE.Shape();
    sh.moveTo(-hz,0); sh.lineTo(hz,0); sh.lineTo(0,N.ridge-N.eave); sh.lineTo(-hz,0);
    var roof=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:N.L,bevelEnabled:false}),
      mat(0x8c8678,.58,THREE.DoubleSide));
    roof.rotation.y=Math.PI/2; roof.position.set(0,N.eave,0); g.add(roof);
    [0,N.L].forEach(function(x){
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(x,N.floor,-hz-1.2), new THREE.Vector3(x,N.floor,hz+1.2)]), line(0xd42a2a,.8)));
    });
    // 내부 구획 3000 / 11150 / 2930 (합 17 080 — 800 부족)
    var ix=0;
    N.inner.forEach(function(w,i){
      ix+=w;
      if(i<N.inner.length-1)
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
          [new THREE.Vector3(ix,N.floor,-hz), new THREE.Vector3(ix,N.floor,hz)]), line(0x1f5fd0,.7)));
    });
    // 구획합 끝점 (17.08) 표시 — 총치수와 벌어지는 지점
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(ix,N.floor,-hz-.6), new THREE.Vector3(ix,N.eave,-hz-.6)]), line(0xd9822b,.9)));
  })();

  /* 부지 조서 치수 (중첩 비교용) */
  (function(){
    var g=G['brief'], bl=SITE.briefL, bw=SITE.briefW, h=3.5;
    var e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(bl,h,bw)), line(0xd42a2a,.85));
    e.position.set(bl/2, N.floor+h/2, 0); g.add(e);
    var b=new THREE.Mesh(new THREE.BoxGeometry(bl,h,bw), mat(0xd42a2a,.08,THREE.DoubleSide));
    b.position.copy(e.position); g.add(b);
  })();

  /* 펌프 · 기초 */
  (function(){
    var g=G['pump'], fl=4.565, fw=2.0, fh=.6;
    N.pump.forEach(function(x,i){
      var big = i < (SITE.bigN||4);
      box(fl,fh,fw, x, N.floor+fh/2, N.W/2-N.axisZ, mat(0x9a9588,.92), g);
      box(big?2.0:1.3, big?1.5:1.0, big?1.3:.9, x-1.5,
          N.floor+fh+(big?.75:.5), N.W/2-N.axisZ, mat(0x0f8f7a,.85), g);
      var r=big?.72:.48;
      var c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1.3,20), mat(0x13a88f,.9));
      c.rotation.z=Math.PI/2; c.position.set(x+.6, N.floor+fh+r, N.W/2-N.axisZ); g.add(c);
    });
  })();

  /* 흡입관 Ø1000 · 압송관 D600→D1000 */
  (function(){
    var gs=G['suct'], gd=G['disc'], ms=mat(0x1f5fd0,.72), md=mat(0xc02a8f,.72);
    var y=N.floor+1.0;
    N.pump.forEach(function(x){
      pipe(.50, 9.0, x, y, -N.W/2-4.5, 'z', ms, gs);
      pipe(.30, 4.6, x, y,  N.W/2+1.0, 'z', md, gd);
    });
    [0,1].forEach(function(k){
      var p=new THREE.Mesh(new THREE.CylinderGeometry(.50,.50,N.L*.52,18,1,true), md);
      p.rotation.z=Math.PI/2;
      p.position.set(N.L*(k?.70:.28), y-.3, N.W/2+2.8+k*1.7);
      gd.add(p);
    });
  })();

  /* 전실 — 개소별 실치수 */
  (function(){
    var g=G['avan'], m=mat(0x6f6a5e,.16,THREE.DoubleSide);
    var al=SITE.avanL, aw=SITE.avanW;
    box(al,3.0,aw, N.L/2, N.floor+1.5, -N.W/2-aw/2-2.5, m, g, 0x6f6a5e);
  })();

  /* 변전소 6.70 × 15.0 — ±0.00 (733,04) 계열 */
  (function(){
    var g=G['sub'], m=mat(0x8a5cd6,.16,THREE.DoubleSide);
    box(15.0,6.0,6.7, N.L/2, N.floor+3.0, N.W/2+12.0, m, g, 0x8a5cd6);
  })();

  /* 표고 충돌 평면 */
  (function(){
    var g=G['datum'];
    [{y:0,     c:0xd9822b},
     {y:-1.9,  c:0xd42a2a}].forEach(function(o){
      var p=new THREE.Mesh(new THREE.PlaneGeometry(44,30), mat(o.c,.10,THREE.DoubleSide));
      p.rotation.x=-Math.PI/2; p.position.set(N.L/2,o.y,0); g.add(p);
      var e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(44,30)), line(o.c,.8));
      e.rotation.x=-Math.PI/2; e.position.copy(p.position); g.add(e);
    });
  })();

  var LAB=[
    {p:new THREE.Vector3(N.L/2, N.ridge+.5, 0), t:'용마루 +7.30', lay:'main'},
    {p:new THREE.Vector3(N.L/2, N.eave+.35, -N.W/2), t:'처마 +5.20', lay:'main'},
    {p:new THREE.Vector3(-2.4, .9, N.W/2), t:'±0.000  582.22', lay:'main'},
    {p:new THREE.Vector3(-2.0, N.floor, N.W/2), t:'-2.60 (579.62)', lay:'main'},
    {p:new THREE.Vector3(N.L/2, N.floor-.9, 0), t:'17 880 (구획합 17 080)', lay:'main'},
    {p:new THREE.Vector3(N.L+1.3, N.floor-.4, 0), t:'축 ②', lay:'main'},
    {p:new THREE.Vector3(-1.3, N.floor-.4, 0), t:'축 ①', lay:'main'},
    {p:new THREE.Vector3(SITE.briefL/2, N.floor+3.8, SITE.briefW/2), t:'조서 7,80 × 45,0 m', lay:'brief'},
    {p:new THREE.Vector3(N.L/2, N.floor+3.2, -N.W/2-SITE.avanW/2-2.5), t:'전실 9,0 × 18,0 m', lay:'avan'},
    {p:new THREE.Vector3(N.L/2, N.floor+6.4, N.W/2+12.0), t:'변전소 ±0.00 733.04', lay:'sub'}
  ];
  var labHost=document.getElementById('lab');
  LAB.forEach(function(o){ var d=document.createElement('div'); d.textContent=o.t; labHost.appendChild(d); o.el=d; });

  var tgt=new THREE.Vector3(N.L/2,1.2,0), sph={r:46,th:.92,ph:1.02};
  function place(){
    camera.position.set(tgt.x+sph.r*Math.sin(sph.ph)*Math.cos(sph.th),
                        tgt.y+sph.r*Math.cos(sph.ph),
                        tgt.z+sph.r*Math.sin(sph.ph)*Math.sin(sph.th));
    camera.lookAt(tgt);
  }
  place();
  var drag=false,px=0,py=0,el=renderer.domElement;
  el.style.touchAction='none';
  el.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointerup',function(){drag=false;});
  el.addEventListener('pointermove',function(e){
    if(!drag) return;
    sph.th-=(e.clientX-px)*.006;
    sph.ph=Math.max(.12,Math.min(1.56,sph.ph-(e.clientY-py)*.005));
    px=e.clientX; py=e.clientY; place();
  });
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    sph.r=Math.max(10,Math.min(130,sph.r*(1+(e.deltaY>0?.1:-.1)))); place();
  },{passive:false});

  function sync(){ LAYERS.forEach(function(l){ G[l.id].visible=!!STATE.lay[l.id]; }); }
  function cut(f){ clip.constant=-2+(N.L+6)*f; }
  function fly(c){ tgt.set(c[0],c[1],c[2]); sph.r=c[3]; place(); }
  function plane(e){ G['datum'].visible=!!e||STATE.lay['datum']; }
  VIEW={sync:sync,cut:cut,fly:fly,plane:plane};
  setMode(STATE.mode);

  window.addEventListener('resize',function(){
    W=host.clientWidth; H=host.clientHeight;
    if(!W||!H) return;
    camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
  });

  var v=new THREE.Vector3();
  function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene,camera);
    LAB.forEach(function(o){
      v.copy(o.p).project(camera);
      var vis=v.z<1&&v.x>-1.05&&v.x<1.05&&v.y>-1.05&&v.y<1.05&&(!o.lay||STATE.lay[o.lay]);
      o.el.dataset.hide=vis?'0':'1';
      if(vis){ o.el.style.left=((v.x*.5+.5)*W)+'px'; o.el.style.top=((-v.y*.5+.5)*H)+'px'; }
    });
  }
  loop();
}catch(err){
  var e=document.getElementById('err');
  e.style.display='flex';
  e.innerHTML='3D 화면을 띄우지 못했습니다.<br>좌측 표고 스택과 우측 검토 결과는 그대로 사용할 수 있습니다.<br>'
    +'<span style="font-size:11px;opacity:.7">'+String(err&&err.message||err)+'</span>';
}
})();
</script>
