function $(id){ return document.getElementById(id); }

function buildElev(){
  var host = $("elevList"); if(!host) return;
  var h = "";
  for(var i=0;i<EV.length;i++){
    var e = EV[i];
    h += '<div class="ev' + (e.warn?" w":"") + '" data-i="'+i+'">'
      +  '<div class="evv">'+e.lab+(e.warn?' <span class="wm">&#9888;</span>':'')+'</div>'
      +  '<div class="evr">'+(e.r===null?"&mdash;":(e.r>0?"+":"")+e.r.toFixed(3))+'</div>'
      +  '<div class="evs">'+e.src+'</div></div>';
  }
  host.innerHTML = h;
  var items = host.getElementsByClassName("ev");
  for(var j=0;j<items.length;j++){
    items[j].onclick = function(){
      var idx = parseInt(this.getAttribute("data-i"),10);
      var cur = host.getElementsByClassName("ev");
      for(var k=0;k<cur.length;k++) cur[k].className = cur[k].className.replace(" sel","");
      this.className += " sel";
      STATE.plane = EV[idx];
      $("planeInfo").innerHTML = "표고면 " + EV[idx].lab + " &middot; " + EV[idx].src;
      if(VIEW && VIEW.plane) VIEW.plane(EV[idx]);
    };
  }
}

function buildIssues(){
  var host = $("issueList"); if(!host) return;
  var cats = {A:"A. 도면집 구성 · 문서관리", B:"B. 표고 기준면", C:"C. 본체 건축 ↔ 기계",
              D:"D. 기계 · 관로", E:"E. 변전소 · 부속동", F:"F. 부속건물 · 전실 · 후속"};
  var h = "", last = "";
  for(var i=0;i<ISSUES.length;i++){
    var s = ISSUES[i];
    if(s.c !== last){ h += '<div class="cat">'+cats[s.c]+'</div>'; last = s.c; }
    var gc = s.g==="최중대"?"g0":(s.g==="중대"?"g1":(s.g==="확인"?"g2":"g3"));
    h += '<div class="is" data-i="'+i+'"><div class="ishead">'
      +  '<span class="num">'+s.n+'</span><span class="gr '+gc+'">'+s.g+'</span>'
      +  '<span class="ttl">'+s.t+'</span></div>'
      +  '<div class="isbody"><p>'+s.d+'</p><div class="src">근거 &middot; '+s.s+'</div></div></div>';
  }
  host.innerHTML = h;
  var items = host.getElementsByClassName("is");
  for(var j=0;j<items.length;j++){
    items[j].onclick = function(){
      var idx = parseInt(this.getAttribute("data-i"),10), s = ISSUES[idx];
      var op = this.className.indexOf(" open")>=0;
      var cur = host.getElementsByClassName("is");
      for(var k=0;k<cur.length;k++) cur[k].className = cur[k].className.replace(" open","");
      if(!op){
        this.className += " open";
        for(var m=0;m<s.lay.length;m++){ STATE.layers[s.lay[m]] = true; syncChk(); }
        if(VIEW && VIEW.sync) VIEW.sync();
        if(VIEW && VIEW.fly) VIEW.fly(s.cam);
        $("statusMsg").innerHTML = "항목 "+s.n+" &middot; 관련 레이어 활성";
      }
    };
  }
}

function syncChk(){
  var box = $("layerBox"); if(!box) return;
  var cbs = box.getElementsByTagName("input");
  for(var i=0;i<cbs.length;i++) cbs[i].checked = !!STATE.layers[cbs[i].value];
}

function setMode(m){
  STATE.mode = m;
  for(var k in STATE.layers) STATE.layers[k] = false;
  var on = MODES[m].on;
  for(var i=0;i<on.length;i++) STATE.layers[on[i]] = true;
  syncChk();
  var bs = $("modeBar").getElementsByTagName("button");
  for(var j=0;j<bs.length;j++) bs[j].className = (bs[j].getAttribute("data-m")===m ? "on":"");
  if(VIEW && VIEW.sync) VIEW.sync();
  if(VIEW && VIEW.fly) VIEW.fly(m==="clash"?"clash":(m==="sub"?"sub":(m==="site"?"site":"main")));
  $("statusMsg").innerHTML = "모드 &middot; " + MODES[m].lab;
}

function bindUI(){
  var bar = $("modeBar"), bs = bar.getElementsByTagName("button");
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){ setMode(this.getAttribute("data-m")); };
  var box = $("layerBox"), cbs = box.getElementsByTagName("input");
  for(var j=0;j<cbs.length;j++) cbs[j].onclick = function(){
    STATE.layers[this.value] = this.checked;
    if(VIEW && VIEW.sync) VIEW.sync();
  };
  var sl = $("cutSlider");
  sl.oninput = function(){
    STATE.cut = parseFloat(this.value)/100;
    $("cutVal").innerHTML = (STATE.cut>=0.999) ? "없음" : (STATE.cut*36).toFixed(1)+" m";
    if(VIEW && VIEW.cut) VIEW.cut(STATE.cut);
  };
  $("clearPlane").onclick = function(){
    STATE.plane = null;
    var cur = $("elevList").getElementsByClassName("ev");
    for(var k=0;k<cur.length;k++) cur[k].className = cur[k].className.replace(" sel","");
    $("planeInfo").innerHTML = "표고를 클릭하면 3D에 수평면이 표시됩니다";
    if(VIEW && VIEW.plane) VIEW.plane(null);
  };
}

buildElev(); buildIssues(); bindUI(); syncChk();

</script>

function mat(c,o,wire){
  return new THREE.MeshLambertMaterial({color:c, transparent:(o!==undefined&&o<1),
    opacity:(o===undefined?1:o), side:THREE.DoubleSide, wireframe:!!wire});
}
function box(g,x0,x1,y0,y1,z0,z1,c,o){
  var m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), mat(c,o));
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); g.add(m); return m;
}
function edge(g,x0,x1,y0,y1,z0,z1,c){
  var e = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0)),
    new THREE.LineBasicMaterial({color:c}));
  e.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); g.add(e); return e;
}
function shell(g,x0,x1,y0,y1,z0,z1,t,c,o){
  box(g,x0,x1,y0,y1,z0,z0+t,c,o); box(g,x0,x1,y0,y1,z1-t,z1,c,o);
  box(g,x0,x0+t,y0,y1,z0+t,z1-t,c,o); box(g,x1-t,x1,y0,y1,z0+t,z1-t,c,o);
  edge(g,x0,x1,y0,y1,z0,z1,c);
}
function cyl(g,x,y,z,r,h,c,o,axis){
  var m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20), mat(c,o));
  m.position.set(x,y,z);
  if(axis==="x") m.rotation.z = Math.PI/2;
  if(axis==="z") m.rotation.x = Math.PI/2;
  g.add(m); return m;
}
function gable(g,x0,x1,zc,halfW,yE,yR,c,o){
  var sh = new THREE.Shape();

var LBL = [
  {p:[L/2, SL+0.15, WD/2],      t:"본체 &plusmn;0.000 = 733.15 / 733.04", c:"#ffd24a"},
  {p:[L/2, FL-0.3, WD/2],       t:"-2.10 = 731.05 펌프실 바닥", c:"#8fb8ff"},
  {p:[AX[0], PED+2.35, WD/2],   t:"전동기 상단 +0.45 &rarr; 슬래브 450mm 관통", c:"#ff8b80"},

/* ---- 궤도 컨트롤 ---- */
var tgt = new THREE.Vector3(10,0,-2), rad=64, th=0.86, ph=1.02;
function place(){
  camera.position.set(
    tgt.x + rad*Math.sin(ph)*Math.cos(th),
    tgt.y + rad*Math.cos(ph),
    tgt.z + rad*Math.sin(ph)*Math.sin(th));
  camera.lookAt(tgt);
}
var drag=false, px=0, py=0, pan=false;
function down(e){ drag=true; pan=(e.button===2||e.shiftKey); px=e.clientX; py=e.clientY; }
function move(e){
  if(!drag) return;
  var dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  if(pan){
    var s = rad*0.0016;
    var rt = new THREE.Vector3().subVectors(camera.position,tgt).cross(new THREE.Vector3(0,1,0)).normalize();
    tgt.addScaledVector(rt, -dx*s); tgt.y += dy*s;
  } else {
    th -= dx*0.006; ph -= dy*0.006;
    ph = Math.max(0.05, Math.min(Math.PI-0.05, ph));
  }
  place();
}
function up(){ drag=false; pan=false; }
renderer.domElement.addEventListener("pointerdown",down);
window.addEventListener("pointermove",move);
window.addEventListener("pointerup",up);
renderer.domElement.addEventListener("contextmenu",function(e){e.preventDefault();});
renderer.domElement.addEventListener("wheel",function(e){
  e.preventDefault(); rad *= (e.deltaY>0?1.11:0.9);
  rad = Math.max(4, Math.min(1200, rad)); place();
},{passive:false});
var tp=null;
renderer.domElement.addEventListener("touchstart",function(e){
  if(e.touches.length===1){ tp={x:e.touches[0].clientX,y:e.touches[0].clientY,d:0}; }
  else if(e.touches.length===2){
    var a=e.touches[0], b=e.touches[1];
    tp={x:0,y:0,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  }
},{passive:true});
renderer.domElement.addEventListener("touchmove",function(e){
  if(!tp) return;
  if(e.touches.length===1 && tp.d===0){
    var dx=e.touches[0].clientX-tp.x, dy=e.touches[0].clientY-tp.y;
    tp.x=e.touches[0].clientX; tp.y=e.touches[0].clientY;
    th -= dx*0.007; ph -= dy*0.007;
    ph = Math.max(0.05, Math.min(Math.PI-0.05, ph)); place();
  } else if(e.touches.length===2){
    var a=e.touches[0], b=e.touches[1];
    var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(tp.d) { rad *= tp.d/d; rad=Math.max(4,Math.min(1200,rad)); place(); }
    tp.d=d;
  }
  e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener("touchend",function(){tp=null;},{passive:true});

/* ---- VIEW API ---- */
var CAMS = {
  site  :{t:[6,14,-6],   r:96, th:0.86, ph:1.00},
  main  :{t:[18,-0.6,1], r:44, th:0.90, ph:1.06},
  pump  :{t:[8,-1.0,2.4],r:17, th:1.20, ph:1.16},
  roof  :{t:[18,2.2,3.2],r:40, th:0.70, ph:0.78},
  clash :{t:[16,18,-8],  r:86, th:1.00, ph:1.10},
  fore  :{t:[18,-2.0,-11],r:38, th:1.35, ph:1.14},
  fore771:{t:[18,36,-11], r:44, th:1.35, ph:1.10},
  sub   :{t:[-16,4,2],   r:34, th:0.92, ph:1.02},
  annex :{t:[-10,2,-8],  r:34, th:0.95, ph:1.00},
  tx8   :{t:[53,-149,0], r:40, th:0.90, ph:1.05}
};
VIEW = {
  sync: function(){
    for(var k in G) if(G[k]) G[k].visible = !!STATE.layers[k];
  },
  cut: function(f){
    if(f>=0.999){ renderer.clippingPlanes = []; }
    else { clipPlane.constant = -0.6 + f*(L+1.2); renderer.clippingPlanes = [clipPlane]; }
  },
  plane: function(e){
    if(!e){ planeMesh.visible=false; return; }
    planeMesh.visible = true;
    planeMesh.position.set(8, e.v - 733.15, -6);
  },
  fly: function(key){
    var c = CAMS[key] || CAMS.main;
    tgt.set(c.t[0],c.t[1],c.t[2]); rad=c.r; th=c.th; ph=c.ph; place();
  }
};

/* ---- 루프 ---- */
function resize(){
  var w=W.clientWidth||800, h=W.clientHeight||600;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
window.addEventListener("resize",resize);
var v3 = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  for(var i=0;i<lblEls.length;i++){
    v3.set(LBL[i].p[0],LBL[i].p[1],LBL[i].p[2]).project(camera);
    var vis = v3.z<1 && Math.abs(v3.x)<1.25 && Math.abs(v3.y)<1.25;
    lblEls[i].style.display = vis ? "block":"none";
    if(vis){
      lblEls[i].style.left = ((v3.x*0.5+0.5)*W.clientWidth)+"px";
      lblEls[i].style.top  = ((-v3.y*0.5+0.5)*W.clientHeight)+"px";
    }
  }
  renderer.render(scene,camera);
}
resize(); place(); VIEW.sync(); loop();
setMode("main");

}catch(err){
  var eb = document.getElementById("err");
  if(eb){ eb.style.display="block"; eb.textContent = "3D 초기화 실패: " + (err && err.message ? err.message : err); }
}
})();
