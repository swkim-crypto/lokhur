#top .meta{font-size:11.5px;color:var(--sub)}

#top .back{margin-left:auto;font-size:11.5px;color:var(--sub);text-decoration:none;

#modeBar{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
#modeBar button{background:#fff;border:0;border-right:1px solid var(--line);padding:6px 13px;

#modeBar button:last-child{border-right:0}
#modeBar button:hover{background:#f0ece2}
#modeBar button.on{background:var(--ink);color:#fff}

#wrap{position:absolute;top:50px;left:0;right:0;bottom:0;display:flex}
#left{width:230px;flex:none;border-right:1px solid var(--line);background:#fbfaf6;
  overflow:auto;padding:12px}
#mid{flex:1;position:relative;min-width:0;background:#e8e5dd}
#right{width:340px;flex:none;border-left:1px solid var(--line);background:#fbfaf6;
  overflow:auto;padding:12px}
h2.sec{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:1.2px;
  color:var(--sub);text-transform:uppercase}

.ev{display:flex;align-items:baseline;gap:7px;padding:5px 7px;border:1px solid transparent;
  border-radius:3px;cursor:pointer;font-size:11.5px}
.ev:hover{background:#fff;border-color:var(--line)}
.ev.on{background:#fff;border-color:var(--ink)}
.ev .v{font-family:var(--mono);font-weight:700;font-size:12px;min-width:56px}
.ev .l{color:var(--sub);font-size:10.5px;flex:1}
.ev.warn .v{color:var(--amb)}
.ev.bad .v{color:var(--red)}
.evnote{margin:9px 0 14px;padding:8px;background:#fff;border:1px solid var(--line);
  border-radius:3px;font-size:10.5px;line-height:1.6;color:var(--sub)}
.evnote b{color:var(--red)}

/* 레이어 */
.lay{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11.5px;cursor:pointer}
.lay input{margin:0}
.sw{width:11px;height:11px;border-radius:2px;flex:none}

#cutRow{margin-top:12px;font-size:11px;color:var(--sub)}
#cut{width:100%;margin-top:4px}

.grp{margin:12px 0 5px;font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.4px}
.iss{border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:5px;

.iss:hover{border-color:var(--sub)}
.iss .hd{display:flex;align-items:center;gap:7px;padding:7px 9px}
.iss .no{font:700 10px/14px var(--mono);color:#fff;background:var(--sub);

.iss.n .no{background:var(--red)}
.iss.f .no{background:var(--grn)}
.iss.p .no{background:var(--amb)}
.iss .t{font-size:11.5px;flex:1;line-height:1.4}
.iss .st{font:700 9.5px/14px var(--mono);flex:none;letter-spacing:.3px}
.iss.n .st{color:var(--red)}
.iss.f .st{color:var(--grn)}
.iss.p .st{color:var(--amb)}

.iss.open .bd{display:block}
.iss .bd b{color:var(--red)}
.iss .bd code{font-family:var(--mono);font-size:10.5px;background:#f2f0ea;padding:1px 4px;
  border-radius:2px}

  padding:30px;text-align:center;font-size:12.5px;color:var(--sub);line-height:1.8}
#lab{position:absolute;inset:0;pointer-events:none;overflow:hidden}

#hint{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--sub);
  background:rgba(251,250,246,.9);padding:4px 8px;border-radius:3px;border:1px solid var(--line)}

@media (max-width:1280px){
  #left{width:196px} #right{width:286px}

@media (max-width:1040px){

@media (max-width:860px){

}
@media (max-width:700px){
  html,body{overflow:auto;height:auto}
  #wrap{position:static;display:block}
  #left,#right{width:auto;border:0;border-bottom:1px solid var(--line)}
  #mid{height:60vh}
  .ev .l{display:block}
}

];

var LAYERS = [
  {id:"new",   nm:"신설 건물 6.5×28.3", c:"#23272e", on:true},
  {id:"old",   nm:"기존 건물 7.0×36.0 (철거)", c:"#d42a2a", on:true},
  {id:"pump",  nm:"펌프 4대 · 기초", c:"#0f8f7a", on:true},
  {id:"suct",  nm:"흡입관 Ø1220 (4가닥)", c:"#1f5fd0", on:true},
  {id:"disc",  nm:"압송관 Ø1020/1220", c:"#c02a8f", on:true},
  {id:"crane", nm:"크레인 거더 · 호이스트", c:"#8a5cd6", on:true},
  {id:"avan",  nm:"전실 (아반카메라)", c:"#6f6a5e", on:true},
  {id:"datum", nm:"표고 충돌 평면", c:"#d9822b", on:false}
];

var MODES = [
  {id:"new",  nm:"신설"},
  {id:"both", nm:"신설+기존 중첩"},
  {id:"sect", nm:"단면"},
  {id:"dat",  nm:"표고 충돌"}
];

var STATE = {mode:"new", lay:{}, cut:1, ev:null};
LAYERS.forEach(function(l){ STATE.lay[l.id] = l.on; });

/* ── 패널 DOM ─────────────────────────────────────────── */
(function(){
  var mb = document.getElementById('modeBar');
  MODES.forEach(function(m){
    var b = document.createElement('button');
    b.textContent = m.nm; b.dataset.m = m.id;
    if (m.id === STATE.mode) b.className = 'on';
    b.onclick = function(){ setMode(m.id); };
    mb.appendChild(b);
  });

  var ec = document.getElementById('evs');
  EV.forEach(function(e, i){
    var d = document.createElement('div');
    d.className = 'ev' + (e.bad ? ' bad' : e.warn ? ' warn' : '');
    d.innerHTML = '<span class="v">' + e.lab + '</span><span class="l">' + e.src + '</span>';
    d.onclick = function(){
      STATE.ev = (STATE.ev === i ? null : i);
      [].forEach.call(ec.children, function(c, j){ c.className = c.className.replace(/ on\b/,'') + (j===STATE.ev?' on':''); });
      if (VIEW) VIEW.plane(STATE.ev === null ? null : e);
    };
    ec.appendChild(d);
  });

  var lc = document.getElementById('lays');
  LAYERS.forEach(function(l){
    var w = document.createElement('label'); w.className = 'lay';
    var cb = document.createElement('input'); cb.type='checkbox'; cb.checked=l.on;
    var sw = document.createElement('span'); sw.className='sw'; sw.style.background=l.c;
    var tx = document.createElement('span'); tx.textContent=l.nm;
    cb.onchange = function(){ STATE.lay[l.id]=cb.checked; if(VIEW) VIEW.sync(); };
    w.appendChild(cb); w.appendChild(sw); w.appendChild(tx); lc.appendChild(w);
  });

  document.getElementById('cut').oninput = function(){
    STATE.cut = this.value/100; if (VIEW) VIEW.cut(STATE.cut);
  };

  var ic = document.getElementById('issues');
  ISSUES.forEach(function(o){
    if (o.sec){
      var g=document.createElement('div'); g.className='grp'; g.textContent=o.sec; ic.appendChild(g); return;
    }
    var d=document.createElement('div'); d.className='iss '+o.k;
    d.innerHTML='<div class="hd"><span class="no">'+o.n+'</span>'
      +'<span class="t">'+o.t+'</span><span class="st">'+o.st+'</span></div>'
      +'<div class="bd">'+o.d+'</div>';
    d.onclick=function(){
      var open=d.className.indexOf('open')>=0;
      [].forEach.call(ic.querySelectorAll('.iss'),function(x){x.className=x.className.replace(/ open\b/,'');});
      if(!open){ d.className+=' open'; if(VIEW&&o.cam) VIEW.fly(o.cam); }
    };
    ic.appendChild(d);
  });
})();

function setMode(m){
  STATE.mode = m;
  [].forEach.call(document.getElementById('modeBar').children, function(b){
    b.className = (b.dataset.m === m) ? 'on' : '';
  });
  var set = {
    new:  {new:1,old:0,pump:1,suct:1,disc:1,crane:1,avan:1,datum:0},
    both: {new:1,old:1,pump:1,suct:1,disc:1,crane:0,avan:1,datum:0},
    sect: {new:1,old:0,pump:1,suct:1,disc:1,crane:1,avan:0,datum:0},
    dat:  {new:1,old:1,pump:0,suct:0,disc:0,crane:0,avan:0,datum:1}
  }[m];
  LAYERS.forEach(function(l){ STATE.lay[l.id] = !!set[l.id]; });
  [].forEach.call(document.getElementById('lays').children, function(w,i){
    w.firstChild.checked = STATE.lay[LAYERS[i].id];
  });
  if (m === 'sect'){ STATE.cut = .5; document.getElementById('cut').value = 50; }
  else { STATE.cut = 1; document.getElementById('cut').value = 100; }
  if (VIEW){ VIEW.sync(); VIEW.cut(STATE.cut); }
}
</script>

<script src="../assets/three.min.js"></script>

<script>
/* ═══ C. 3D 장면 ═════════════════════════════════════════════
   좌표계: X = 건물 종방향(축① → ②) / Z = 횡방향(А → Б) / Y = 표고
   단위 m. 0 = 신설 건물 ±0.000.                               */
(function(){
try{
  var host = document.getElementById('mid');
  var W = host.clientWidth || 800, H = host.clientHeight || 600;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e5dd);
  var camera = new THREE.PerspectiveCamera(42, W/H, 0.5, 2000);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(W, H);
  renderer.localClippingEnabled = true;
  host.insertBefore(renderer.domElement, host.firstChild);

  scene.add(new THREE.AmbientLight(0xffffff, .72));
  var dl = new THREE.DirectionalLight(0xffffff, .55); dl.position.set(30,50,25); scene.add(dl);
  var dl2 = new THREE.DirectionalLight(0xffffff, .25); dl2.position.set(-25,20,-20); scene.add(dl2);

  /* ── 치수 (도면 기재값, m) ─────────────────────────── */
  var N = {                      // 신설
    L: 28.30,                    // 총치수 (구간합 27.60, 별기 27.90)
    Lseg: 27.60,
    W: 6.50,
    floor: -2.20,                // (697.38)
    eave: 8.20,
    ridge: 10.70,
    wall: 0.40,
    pump: [6.10, 12.20, 18.30, 24.40],   // 축① 기준 펌프 중심
    axisZ: 2.30,                 // А 로부터 기기축
    fndL: 4.00, fndW: 2.00, fndH: 0.60
  };
  var O = { L: 36.00, W: 7.00, off: -3.0, floor: -2.10, top: 0.0 };  // 기존(철거)

  var G = {};   // 레이어별 그룹
  LAYERS.forEach(function(l){ G[l.id] = new THREE.Group(); scene.add(G[l.id]); });

  var clip = new THREE.Plane(new THREE.Vector3(-1,0,0), 100);  // x < c 보존
  renderer.clippingPlanes = [clip];

  function mat(c, o, side){
    // 반투명 외피가 깊이버퍼를 쓰면 내부 설비를 가립니다 → depthWrite 끔
    return new THREE.MeshLambertMaterial({color:c, transparent:o<1, opacity:o,
      depthWrite: o >= 0.7,
      side: side||THREE.FrontSide, clippingPlanes:[clip]});
  }
  function line(c, o){
    return new THREE.LineBasicMaterial({color:c, transparent:o<1, opacity:o===undefined?1:o,
      clippingPlanes:[clip]});
  }
  function box(w,h,d,x,y,z,m,g){
    var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
    b.position.set(x,y,z); g.add(b);
    var e=new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry), line(0x23272e,.5));
    e.position.copy(b.position); g.add(e); return b;
  }
  function pipe(r,len,x,y,z,rot,m,g){
    var p=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,18,1,true), m);
    p.position.set(x,y,z);
    if(rot==='x') p.rotation.z=Math.PI/2;
    if(rot==='z') p.rotation.x=Math.PI/2;
    g.add(p); return p;
  }

  /* ── 신설 건물 ───────────────────────────────────── */
  (function(){
    var g=G['new'], m=mat(0xf4f2ec,.42,THREE.DoubleSide);
    var hz=N.W/2;
    // 바닥
    box(N.L, .3, N.W, N.L/2, N.floor-.15, 0, mat(0xd8d4c8,.9), g);
    // 벽 4면 (±0.00 ~ 처마)
    var hw=(N.eave-N.floor);
    box(N.L, hw, N.wall, N.L/2, N.floor+hw/2, -hz, m, g);
    box(N.L, hw, N.wall, N.L/2, N.floor+hw/2,  hz, m, g);
    box(N.wall, hw, N.W, 0,    N.floor+hw/2, 0, m, g);
    box(N.wall, hw, N.W, N.L,  N.floor+hw/2, 0, m, g);
    // 박공 지붕
    var sh=new THREE.Shape();
    sh.moveTo(-hz,0); sh.lineTo(hz,0); sh.lineTo(0, N.ridge-N.eave); sh.lineTo(-hz,0);
    var roof=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:N.L,bevelEnabled:false}),
      mat(0x8c8678,.62,THREE.DoubleSide));
    roof.rotation.y=Math.PI/2; roof.position.set(0,N.eave,0);
    roof.material.clippingPlanes=[clip]; g.add(roof);
    // 축선
    var ax=new THREE.Group();
    [0,N.L].forEach(function(x){
      var pts=[new THREE.Vector3(x,N.floor,-hz-1.2), new THREE.Vector3(x,N.floor,hz+1.2)];
      ax.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), line(0xd42a2a,.8)));
    });
    g.add(ax);
  })();

  /* ── 기존 건물 (철거) ────────────────────────────── */
  (function(){
    var g=G['old'], m=mat(0xd42a2a,.13,THREE.DoubleSide);
    var hz=O.W/2, h=3.5;
    box(O.L, h, O.W, O.off+O.L/2, O.floor+h/2, 0, m, g);
    var e=new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(O.L,h,O.W)), line(0xd42a2a,.75));
    e.position.set(O.off+O.L/2, O.floor+h/2, 0); g.add(e);
  })();

  /* ── 펌프 · 기초 ─────────────────────────────────── */
  (function(){
    var g=G['pump'];
    N.pump.forEach(function(x,i){
      var fy=N.floor+N.fndH/2;
      box(N.fndL, N.fndH, N.fndW, x, fy, N.W/2-N.axisZ, mat(0x9a9588,.92), g);
      // 전동기
      box(2.0,1.5,1.3, x-1.5, N.floor+N.fndH+.75, N.W/2-N.axisZ, mat(0x0f8f7a,.85), g);
      // 펌프 케이싱
      var c=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,1.4,20), mat(0x13a88f,.9));
      c.rotation.z=Math.PI/2; c.position.set(x+.6, N.floor+N.fndH+.7, N.W/2-N.axisZ); g.add(c);
    });
  })();

  /* ── 흡입관 Ø1220 · 압송관 ───────────────────────── */
  (function(){
    var gs=G['suct'], gd=G['disc'];
    var ms=mat(0x1f5fd0,.72), md=mat(0xc02a8f,.72);
    var y=N.floor+1.0;
    N.pump.forEach(function(x){
      // 흡입: 전실 → 건물 (북측 -Z)
      pipe(.61, 10.0, x, y, -N.W/2-5.0, 'z', ms, gs);
      // 토출: 펌프 → 남측 벽 통과 (+Z)
      pipe(.35, 5.0, x, y, N.W/2+1.0, 'z', md, gd);
    });
    // 합류 압송관 2가닥 — 건물 남측에서 종방향으로 묶임
    [0,1].forEach(function(k){
      var zc = N.W/2 + 3.0 + k*1.8;
      var p=new THREE.Mesh(new THREE.CylinderGeometry(.51,.51,N.L*0.55,18,1,true), md);
      p.rotation.z=Math.PI/2;
      p.position.set(N.L*(k?0.70:0.28), y-.3, zc);
      gd.add(p);
    });
  })();

  /* ── 크레인 거더 · 호이스트 ──────────────────────── */
  (function(){
    var g=G['crane'], m=mat(0x8a5cd6,.85);
    var y=N.eave-1.2;
    [-1,1].forEach(function(s){
      box(N.L-1.0, .35, .25, N.L/2, y, s*(N.W/2-.7), m, g);
    });
    box(.5,.45,N.W-1.4, N.L*0.42, y-.4, 0, m, g);     // 트롤리
    box(.22,1.0,.22, N.L*0.42, y-1.3, 0, mat(0xd42a2a,.9), g);  // 훅
  })();

  /* ── 전실 ────────────────────────────────────────── */
  (function(){
    var g=G['avan'], m=mat(0x6f6a5e,.18,THREE.DoubleSide);
    box(40.0, 3.0, 7.0, 12.0, N.floor+1.5, -N.W/2-9.5, m, g);
    var e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(40,3,7)),
      line(0x6f6a5e,.6));
    e.position.set(12.0, N.floor+1.5, -N.W/2-9.5); g.add(e);
    // 최고수위 698.66 → -0.92
    var wp=new THREE.Mesh(new THREE.PlaneGeometry(40,7), mat(0x1f5fd0,.17,THREE.DoubleSide));
    wp.rotation.x=-Math.PI/2; wp.position.set(12.0,-0.92,-N.W/2-9.5); g.add(wp);
  })();

  /* ── 표고 충돌 평면 ──────────────────────────────── */
  var datumPlanes = {};
  (function(){
    var g=G['datum'];
    // 582.22 와 699.58 을 같은 ±0.000 으로 본 두 해석의 지반선
    [{y:0, c:0xd9822b, t:'±0.000 = 699.58 (단면)'},
     {y:0, c:0xd42a2a, t:'±0.000 = 582.22 (평면)'}].forEach(function(o,i){
      var p=new THREE.Mesh(new THREE.PlaneGeometry(50,26), mat(o.c,.10,THREE.DoubleSide));
      p.rotation.x=-Math.PI/2; p.position.set(12, i? -1.6 : 0, 0); g.add(p);
      var e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(50,26)),
        line(o.c,.8)); e.rotation.x=-Math.PI/2; e.position.copy(p.position); g.add(e);
    });
  })();

  /* ── 라벨 ────────────────────────────────────────── */
  var LAB = [
    {p:new THREE.Vector3(N.L/2, N.ridge+.6, 0), t:'용마루 +10.70', lay:'new'},
    {p:new THREE.Vector3(N.L/2, N.eave+.4, -N.W/2), t:'처마 +8.20', lay:'new'},
    {p:new THREE.Vector3(-2.6, 0.9, N.W/2), t:'±0.000  582.22 / 699.58'},
    {p:new THREE.Vector3(-1.2, N.floor, N.W/2), t:'-2.20 (697.38)'},
    {p:new THREE.Vector3(N.L/2, N.floor-.9, 0), t:'28 300 (구간합 27 600)'},
    {p:new THREE.Vector3(N.L+1.4, N.floor, 0), t:'축 ②'},
    {p:new THREE.Vector3(-1.4, N.floor-0.5, 0), t:'축 ①'},
    {p:new THREE.Vector3(O.off+O.L/2, O.top+.6, O.W/2+.5), t:'기존 7.0×36.0 철거', lay:'old'},
    {p:new THREE.Vector3(12.0, -0.92, -N.W/2-9.5), t:'전실 최고수위 698.66', lay:'avan'}
  ];
  var labHost = document.getElementById('lab');
  LAB.forEach(function(o){
    var d=document.createElement('div'); d.textContent=o.t; labHost.appendChild(d); o.el=d;
  });

  /* ── 자체 궤도 컨트롤 ────────────────────────────── */
  var tgt = new THREE.Vector3(N.L/2, 1.5, 0);
  var sph = {r:52, th:0.92, ph:1.02};
  function place(){
    camera.position.set(
      tgt.x + sph.r*Math.sin(sph.ph)*Math.cos(sph.th),
      tgt.y + sph.r*Math.cos(sph.ph),
      tgt.z + sph.r*Math.sin(sph.ph)*Math.sin(sph.th));
    camera.lookAt(tgt);
  }
  place();

  var drag=false, px=0, py=0;
  var el=renderer.domElement;
  el.style.touchAction='none';
  el.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointerup',  function(e){drag=false;});
  el.addEventListener('pointermove',function(e){
    if(!drag) return;
    sph.th -= (e.clientX-px)*0.006;
    sph.ph = Math.max(0.12, Math.min(1.56, sph.ph - (e.clientY-py)*0.005));
    px=e.clientX; py=e.clientY; place();
  });
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    sph.r = Math.max(12, Math.min(140, sph.r * (1 + (e.deltaY>0?0.1:-0.1))));
    place();
  },{passive:false});

  /* ── API ─────────────────────────────────────────── */
  function sync(){
    LAYERS.forEach(function(l){ G[l.id].visible = !!STATE.lay[l.id]; });
  }
  function cut(f){
    clip.constant = -2 + (N.L + 6) * f;   // 종방향(X) 절단
  }
  function fly(c){
    tgt.set(c[0], c[1], c[2]); sph.r = c[3]; place();
  }
  function plane(e){
    G['datum'].visible = !!e || STATE.lay['datum'];
  }
  VIEW = {sync:sync, cut:cut, fly:fly, plane:plane};

  setMode(STATE.mode);   // 초기 레이어를 모드에 맞춤 (sync·cut 포함)

  function onResize(){
    W = host.clientWidth; H = host.clientHeight;
    if(!W||!H) return;
    camera.aspect = W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
  }
  window.addEventListener('resize', onResize);

  var v = new THREE.Vector3();
  function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene, camera);
    LAB.forEach(function(o){
      v.copy(o.p).project(camera);
      var vis = v.z < 1 && v.x > -1.05 && v.x < 1.05 && v.y > -1.05 && v.y < 1.05
                && (!o.lay || STATE.lay[o.lay]);
      o.el.dataset.hide = vis ? '0' : '1';
      if(vis){
        o.el.style.left = ((v.x*0.5+0.5)*W) + 'px';
        o.el.style.top  = ((-v.y*0.5+0.5)*H) + 'px';
      }
    });
  }
  loop();

} catch(err){
  var e=document.getElementById('err');
  e.style.display='flex';
  e.innerHTML='3D 화면을 띄우지 못했습니다.<br>' +
    '좌측 표고 스택과 우측 검토 결과는 그대로 사용할 수 있습니다.<br>' +
    '<span style="font-size:11px;opacity:.7">' + String(err && err.message || err) + '</span>';
}
})();
</script>
