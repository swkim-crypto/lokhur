#rst:hover{background:#efece3}
#vp{flex:1;position:relative;min-height:0;background:var(--pap)}

.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;

#det th{background:#f2efe7}
@media(max-width:1180px){

/* ---- 궤도 컨트롤 ---- */
var tgt=new THREE.Vector3(18,0,3.2), rad=46, th=0.85, ph=1.05;
function place(){
  camera.position.set(tgt.x+rad*Math.sin(ph)*Math.cos(th),
                      tgt.y+rad*Math.cos(ph),
                      tgt.z+rad*Math.sin(ph)*Math.sin(th));
  camera.lookAt(tgt);
}
place();
var down=false,lx=0,ly=0,pinch=0;
var cv=renderer.domElement;
cv.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',function(e){down=false;});
cv.addEventListener('pointerleave',function(){down=false;});
cv.addEventListener('pointermove',function(e){
  if(!down) return;
  th-=(e.clientX-lx)*0.006; ph-=(e.clientY-ly)*0.006;
  ph=Math.max(0.08,Math.min(Math.PI-0.08,ph)); lx=e.clientX; ly=e.clientY; place();
});
cv.addEventListener('wheel',function(e){ e.preventDefault();
  rad*=(e.deltaY>0?1.10:0.90); rad=Math.max(3,Math.min(2200,rad)); place(); },{passive:false});
cv.addEventListener('touchstart',function(e){ if(e.touches.length===2){
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);} },{passive:true});
cv.addEventListener('touchmove',function(e){ if(e.touches.length===2){
  var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch){ rad*=pinch/d; rad=Math.max(3,Math.min(2200,rad)); place(); } pinch=d; e.preventDefault(); } },{passive:false});

/* ---- 애니메이션 ---- */
var fly=null;
function animate(){
  requestAnimationFrame(animate);
  if(fly){
    var s=0.13;
    tgt.lerp(fly.t,s); rad+=(fly.r-rad)*s;
    if(tgt.distanceTo(fly.t)<0.15 && Math.abs(rad-fly.r)<0.4) fly=null;
    place();
  }
  renderer.render(scene,camera);
  if(STATE.layers.label){
    for(var i=0;i<LB.length;i++){
      var L=LB[i];
      if(!STATE.layers[L.g]){ L.el.style.display='none'; continue; }
      var v=new THREE.Vector3(L.p[0],L.p[1],L.p[2]).project(camera);
      if(v.z>1){ L.el.style.display='none'; continue; }
      L.el.style.display='block';
      L.el.style.left=((v.x*0.5+0.5)*W)+'px';
      L.el.style.top=((-v.y*0.5+0.5)*H)+'px';
    }
  } else { for(var j=0;j<LB.length;j++) LB[j].el.style.display='none'; }
}
animate();

});
