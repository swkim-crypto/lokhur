<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로후르-1 · 기존 ↔ 보완본 나란히 비교</title>
<style>
:root{
  --ink:#23272e; --pap:#f2f0ea; --line:#cfc9bb; --sub:#6f6a5e;
  --old:#245f8f; --new:#a55c14;
  --mono:ui-monospace,Menlo,Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--pap);color:var(--ink);
  font:13px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}

#bar{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;
  border-bottom:1px solid var(--line);background:#fbfaf6}
#bar h1{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
#bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
  border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--sub);
  font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:none;
  white-space:nowrap}
.btn:hover{border-color:var(--sub);color:var(--ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grp{display:flex}
.grp .btn{border-radius:0;border-right:0}
.grp .btn:first-child{border-radius:3px 0 0 3px}
.grp .btn:last-child{border-radius:0 3px 3px 0;border-right:1px solid var(--line)}
.grp .btn.on+.btn{border-left-color:var(--ink)}

#stage{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex}
#stage.vert{flex-direction:column}
.pane{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:#e8e5dd}
.pane .hd{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700}
.pane .hd .tag{font:700 9.5px/14px var(--mono);padding:1px 6px;border-radius:2px;color:#fff}
.pane.old .hd .tag{background:var(--old)}
.pane.new .hd .tag{background:var(--new)}
.pane .hd .pop{margin-left:auto;font-size:11px;font-weight:600;color:var(--sub);
  text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:2px 7px;background:#fbfaf6}
.pane .hd .pop:hover{border-color:var(--sub);color:var(--ink)}
.pane iframe{flex:1;width:100%;border:0;background:#e8e5dd}
.pane.hide{display:none}

#div{flex:none;width:6px;cursor:col-resize;background:var(--line);position:relative}
#div::after{content:"";position:absolute;left:1px;top:50%;width:4px;height:42px;
  margin-top:-21px;border-radius:2px;background:#9d978a}
#stage.vert #div{width:auto;height:6px;cursor:row-resize}
#stage.vert #div::after{left:50%;top:1px;width:42px;height:4px;margin:0 0 0 -21px}
#div.off{display:none}

#note{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;
  font-size:11px;color:var(--sub);background:rgba(251,250,246,.94);padding:5px 11px;
  border-radius:3px;border:1px solid var(--line)}

@media (max-width:820px){
  #bar{height:auto;flex-wrap:wrap;padding:7px 10px}
  #bar h1{width:100%}
  #stage{top:84px;flex-direction:column}
  #div{width:auto;height:6px;cursor:row-resize}
}
</style></head>
<body>

<div id="bar">
  <h1>로후르-1 · 기존 ↔ 보완본</h1>
  <div class="grp" id="layout">
    <button class="btn on" data-l="h">좌우 분할</button>
    <button class="btn" data-l="v">상하 분할</button>
  </div>
  <div class="grp" id="only">
    <button class="btn on" data-o="both">둘 다</button>
    <button class="btn" data-o="old">기존만</button>
    <button class="btn" data-o="new">보완만</button>
  </div>
  <button class="btn" id="swap">↔ 좌우 바꾸기</button>
  <button class="btn" id="reset">50:50</button>
  <span class="sp"></span>
  <a class="btn" href="../index.html">← 포털</a>
</div>

<div id="stage">
  <div class="pane old" id="pOld">
    <div class="hd">
      <span class="tag">2026-08</span>
      <span>기존 검토 · 부적합 24건</span>
      <a class="pop" href="lokhur-1.html" target="_blank" rel="noopener">새 창 ↗</a>
    </div>
    <iframe src="lokhur-1.html" title="로후르-1 기존 검토"></iframe>
  </div>

  <div id="div"></div>

  <div class="pane new" id="pNew">
    <div class="hd">
      <span class="tag">2026-11</span>
      <span>보완본 · 해소 0 / 미해소 11 / 신규 5</span>
      <a class="pop" href="lokhur-1-rev2611.html" target="_blank" rel="noopener">새 창 ↗</a>
    </div>
    <iframe src="lokhur-1-rev2611.html" title="로후르-1 보완본 검토"></iframe>
  </div>
</div>

<div id="note">두 화면은 각각 따로 회전·확대합니다 · 경계선을 끌어 비율 조정</div>

<script>
(function(){
  var stage=document.getElementById('stage'),
      dv=document.getElementById('div'),
      pOld=document.getElementById('pOld'),
      pNew=document.getElementById('pNew'),
      note=document.getElementById('note');

  /* ── 레이아웃 전환 ──────────────────────────────── */
  document.getElementById('layout').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(this.children,function(x){x.className='btn'+(x===b?' on':'');});
    stage.className = (b.dataset.l==='v') ? 'vert' : '';
    setRatio(ratio);
  });

  /* ── 한쪽만 보기 ────────────────────────────────── */
  document.getElementById('only').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(this.children,function(x){x.className='btn'+(x===b?' on':'');});
    var o=b.dataset.o;
    pOld.className='pane old'+(o==='new'?' hide':'');
    pNew.className='pane new'+(o==='old'?' hide':'');
    dv.className = (o==='both') ? '' : 'off';
    note.textContent = (o==='both')
      ? '두 화면은 각각 따로 회전·확대합니다 · 경계선을 끌어 비율 조정'
      : (o==='old' ? '기존(2026-08) 검토만 표시 중' : '보완본(2026-11) 검토만 표시 중');
  });

  /* ── 좌우 바꾸기 ────────────────────────────────── */
  document.getElementById('swap').onclick = function(){
    if (pOld.nextElementSibling === dv) stage.insertBefore(pNew, pOld);
    else stage.insertBefore(pOld, pNew);
    // 분할선이 항상 가운데 오도록
    stage.insertBefore(dv, stage.children[1]);
    ratio = 1 - ratio; setRatio(ratio);
  };

  /* ── 비율 ───────────────────────────────────────── */
  var ratio = 0.5;
  function setRatio(r){
    ratio = Math.max(.15, Math.min(.85, r));
    var a = stage.children[0], b = stage.children[2];
    a.style.flex = ratio + ' 1 0%';
    b.style.flex = (1-ratio) + ' 1 0%';
  }
  document.getElementById('reset').onclick = function(){ setRatio(.5); };
  setRatio(.5);

  /* ── 분할선 끌기 ────────────────────────────────── */
  var drag=false;
  dv.addEventListener('pointerdown', function(e){
    drag=true; dv.setPointerCapture(e.pointerId);
    // 끄는 동안 iframe 이 포인터를 가로채지 않게 합니다
    [].forEach.call(document.querySelectorAll('iframe'), function(f){
      f.style.pointerEvents='none';
    });
  });
  function stop(){
    drag=false;
    [].forEach.call(document.querySelectorAll('iframe'), function(f){
      f.style.pointerEvents='';
    });
  }
  dv.addEventListener('pointerup', stop);
  dv.addEventListener('pointercancel', stop);
  window.addEventListener('pointermove', function(e){
    if(!drag) return;
    var r = stage.getBoundingClientRect();
    setRatio(stage.className==='vert'
      ? (e.clientY - r.top) / r.height
      : (e.clientX - r.left) / r.width);
  });

  /* ── 단축키 ─────────────────────────────────────── */
  document.addEventListener('keydown', function(e){
    if (e.key === 'v' || e.key === 'ㅍ'){
      document.querySelector('#layout button[data-l="'+(stage.className==='vert'?'h':'v')+'"]').click();
    }
  });
})();
</script>
</body></html>
