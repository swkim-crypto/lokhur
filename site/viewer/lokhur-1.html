<style>
  :root{
    --bg:#0d1218; --panel:#141b24; --panel2:#1b232e; --rule:#2a3542;

    --axis:#e0342b; --dim:#3d7fe0; --collect:#22a862; --press:#c04aa6; --timber:#dda52e;

    --disp:'Archivo Narrow','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  body{display:flex;flex-direction:column}
  header{flex:0 0 auto;border-bottom:1px solid var(--rule);padding:9px 14px;display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
  header h1{margin:0;font-family:var(--disp);font-weight:700;font-size:15px}
  header .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
  header .warn{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--axis);border:1px solid var(--axis);padding:2px 7px}
  main{flex:1 1 auto;display:flex;min-height:0}
  #rail{flex:0 0 214px;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #rail .cap,#side .cap{padding:8px 11px 6px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--rule)}
  #side .cap{display:flex;justify-content:space-between}
  #side .cap u{text-decoration:none;font-family:var(--mono);color:var(--axis)}
  #stack{flex:1 1 auto;overflow-y:auto;padding:4px 0 12px}
  .ev{display:grid;grid-template-columns:60px 12px 1fr;align-items:center;gap:6px;padding:3px 9px;cursor:pointer;border-left:2px solid transparent}
  .ev:hover,.ev.on{background:var(--panel2);border-left-color:var(--axis)}
  .ev b{font-family:var(--mono);font-size:11.5px;font-weight:500;text-align:right}
  .ev .tk{height:1px;background:var(--ink3)}
  .ev.cf .tk{background:var(--axis);height:2px}
  .ev.cf b{color:var(--axis)}
  .ev span{font-size:10.5px;color:var(--ink2);line-height:1.25}
  .ev em{display:block;font-family:var(--mono);font-size:9px;color:var(--ink3);font-style:normal}
  .grp{padding:10px 11px 3px;font-family:var(--disp);font-size:10px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
  .grp i{color:var(--axis);font-style:normal}
  #view{flex:1 1 auto;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;font-family:var(--mono);font-size:10px;color:var(--ink2);white-space:nowrap;
    text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
  .lbl.ax{color:var(--axis);font-weight:600;font-size:10.5px}
  .lbl.rm{color:var(--ink);background:rgba(13,18,24,.74);padding:1px 4px;border:1px solid var(--rule);font-size:9.5px}
  .lbl.hot{color:#ffd7d4;background:rgba(224,52,43,.3);border:1px solid var(--axis);padding:1px 5px;font-size:9.5px}
  #modes{position:absolute;top:12px;left:12px;display:flex;border:1px solid var(--rule);background:rgba(13,18,24,.86)}
  #modes button{appearance:none;background:none;border:0;border-right:1px solid var(--rule);color:var(--ink2);
    font-family:var(--disp);font-size:11.5px;font-weight:600;padding:7px 12px;cursor:pointer}
  #modes button:last-child{border-right:0}
  #modes button.on{background:var(--ink);color:var(--bg)}
  #modes button:focus-visible{outline:2px solid var(--dim);outline-offset:-2px}
  #legend{position:absolute;right:12px;bottom:12px;background:rgba(13,18,24,.86);border:1px solid var(--rule);
    padding:8px 10px;font-family:var(--mono);font-size:9.5px;color:var(--ink2);line-height:1.75}
  #legend i{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle}
  #hint{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
  #err{position:absolute;inset:52px 12px auto 12px;border:1px solid var(--axis);background:rgba(224,52,43,.09);
    padding:12px 14px;font-family:var(--mono);font-size:11px;color:var(--ink);line-height:1.7}
  #err b{color:var(--axis)}
  #side{flex:0 0 330px;border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #list{flex:1 1 auto;overflow-y:auto}
  .sec{padding:7px 12px 4px;font-family:var(--disp);font-size:10px;letter-spacing:.11em;color:var(--ink3);
    text-transform:uppercase;background:#111823;border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
  .it{border-bottom:1px solid var(--rule);padding:9px 12px;cursor:pointer}
  .it:hover{background:var(--panel2)}
  .it.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--axis)}
  .it h3{margin:0 0 3px;font-size:12px;font-weight:600;line-height:1.35;display:flex;gap:7px}
  .it h3 u{text-decoration:none;font-family:var(--mono);font-size:10px;color:var(--ink3);flex:0 0 auto;padding-top:1px}
  .it .sv{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;padding:1px 5px;margin-bottom:5px;border:1px solid currentColor}
  .sv.a{color:var(--axis)} .sv.b{color:var(--timber)} .sv.c{color:var(--ink3)}
  .it p{margin:0;font-size:11px;line-height:1.6;color:var(--ink2);display:none}
  .it.on p{display:block}
  .it p b{color:var(--ink);font-weight:600}
  .it p code{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .it p .z{color:var(--axis);font-family:var(--mono);font-size:10.5px}
  footer{flex:0 0 auto;border-top:1px solid var(--rule);padding:7px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  footer .ttl{font-family:var(--disp);font-size:10px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
  .chip{font-family:var(--mono);font-size:10px;color:var(--ink2);border:1px solid var(--rule);padding:3px 8px;cursor:pointer;user-select:none}
  .chip.on{color:var(--ink);border-color:var(--ink2);background:var(--panel2)}
  .cut{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
  .cut input[type=range]{width:92px;accent-color:var(--axis)}
  .cut output{color:var(--axis);min-width:42px;display:inline-block}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--panel)}::-webkit-scrollbar-thumb{background:var(--rule)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:1120px){#rail{flex-basis:176px}#side{flex-basis:258px}}
</style>

<body>
<header>
  <h1>로후르-1 양수장 &mdash; 도면 정합성 3D 검토</h1>
  <span class="sub">루다키 지구 / 실시설계 РП / 두샨베-2026 &middot; 5개 앨범 57장 &middot; 원본 150 dpi 래스터</span>
  <span class="warn" id="cnt">부적합 &mdash;</span>
</header>
<main>
  <aside id="rail"><div class="cap">표고 스택</div><div id="stack"></div></aside>
  <section id="view">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="modes">
      <button data-m="site" class="on">부지 전체</button>
      <button data-m="ps">양수장·전실</button>
      <button data-m="sub">변전소</button>
      <button data-m="cf">불일치 중첩</button>
    </div>
    <div id="legend">
      <div><i style="background:#8b96a3"></i>철근콘크리트</div>
      <div><i style="background:#c9b79c"></i>조적 · 마감</div>
      <div><i style="background:#dda52e"></i>목조 · 철골 지붕틀</div>
      <div><i style="background:#3d7fe0"></i>흡입관 Ø1000 (4계열)</div>
      <div><i style="background:#c04aa6"></i>가압송수관 D1000</div>
      <div><i style="background:#22a862"></i>전실 수면 · 방류</div>
      <div><i style="background:#e0342b"></i>불일치 · 타 도면 외곽</div>
    </div>
    <div id="hint">드래그 회전 &middot; 휠 확대 &middot; Shift+드래그 이동</div>
  </section>
  <aside id="side"><div class="cap"><span>부적합 · 질의 항목</span><u id="cnt2">&mdash;</u></div><div id="list"></div></aside>
</main>
<footer>
  <span class="ttl">레이어</span>
  <span class="chip on" data-l="roof">지붕</span>
  <span class="chip on" data-l="wall">벽체·창호</span>
  <span class="chip on" data-l="sub">지하·기초</span>
  <span class="chip on" data-l="mech">펌프·배관</span>
  <span class="chip on" data-l="fore">전실</span>
  <span class="chip on" data-l="trafo">변전소</span>
  <span class="chip on" data-l="small">당직실·화장실</span>
  <span class="chip on" data-l="site">부지·관로</span>
  <span class="chip" data-l="ghost">타 도면 외곽</span>
  <span class="ttl" style="margin-left:4px">절단</span>
  <label class="cut">종 <input type="range" id="cutZ" min="-14" max="20" step="0.2" value="20"><output id="oz">off</output></label>
  <label class="cut">횡 <input type="range" id="cutX" min="-24" max="38" step="0.2" value="38"><output id="ox">off</output></label>
</footer>

var ISSUES=[
 {sec:'A. 도면집 구성 · 문서관리'},
 {id:'01',sv:'a',t:'5개 앨범 표지 제목이 전부 내용과 불일치', cam:[6,2,-4,58],
  p:'제출된 5개 앨범의 표지 제목과 실제 수록 내용이 <b>한 건도 맞지 않고 서로 교차</b>되어 있다.<br><br>'+
    '· 건축부 → 표지 "전실(아반카메라) 수공구조물 설계" / 내용 <b>양수장 AC 6장 + 변전소 AC 8장</b><br>'+
    '· 기술부 → 표지 "전실(아반카메라) 건축·토목 부분" / 내용 <b>양수장 공정 TX 12장</b><br>'+

 {id:'04',sv:'a',t:'AC-3과 TX-3이 동일 도면 · AC 앨범에 건축 평면도 없음', cam:[18,1,3,44],

    '그 결과 AC 앨범 6장의 구성이 ① 일반사항 ② 부지 평면도 ③ <b>수력기계설비 배치도</b> ④ 단면도 ⑤ 지붕 평면도 ⑥ 지붕 목구조가 되어, '+
    '<b>양수장 본체의 건축 평면도와 입면도가 한 장도 없다.</b> 실 구획·마감·개구부 배치를 건축 도면으로 확인할 수 없다.<br><br>'+
    'AC 앨범 표1의 도면 목록 표제도 <b>"주요구성(ТХ) 작업도면 목록"</b>으로 잘못 기재되어 있다.'},
 {id:'05',sv:'b',t:'제출 누락 — 전기부문(ЭО) 등 4개 구성', cam:[6,2,-4,58],

    '· <code>ПЗ</code> 설명서 1권, <code>ТГИ</code> 공학·지형측량 조사 2권, <code>СМ</code> 견적서류 3권<br><br>'+

 {sec:'B. 양수장 본체'},
 {id:'06',sv:'a',t:'펌프 전동기가 슬래브를 450 mm 관통', cam:[14.3,-1,1.6,15], layer:'mech',

 {id:'07',sv:'a',t:'양중 계획 부재 — 기존 레일 보수만 계상', cam:[14.3,1,3.2,18], layer:'mech',
  p:'AC-4 물량내역서는 <code>기존 레일 보수 72.0 m</code>와 <code>기존 레일 위 회전바퀴 교체 12개</code>만 계상하고, 설비·자재 사양서(TX-12)에는 <b>양중설비가 없다</b>.<br><br>'+
    '인양 대상은 №1~3 <code>11 698 kg/대</code>, №4 <code>9 902 kg/대</code>(합계 44 996 kg)이다. 기존 크레인의 <b>정격 하중·양정·훅 높이가 어느 도면에도 없다</b>. '+
    '항목 06과 함께 보면 유효고 2.10 m 안에서 전고 2.20 m 기기를 인양·반출하는 것이 성립하지 않는다.<br><br>'+
    '참고로 로후르-0에는 <code>T3 10-921 · 10톤 이하 전동 호이스트</code>가 계상되어 있었고, 그때도 세트 중량 11.7 t을 넘겨 정격 초과였다.'},
 {id:'08',sv:'a',t:'본체 폭 5종 · 길이 3종', cam:[18,1,3,44],
  p:'<b>폭</b> — 부지 범례 <code>7.80 m</code> / AC-3 축 А–Б <code>6 400</code> / AC-5·6 외곽 <code>7 600</code> / AC-4 단면 <code>6 000</code> / AC-6 단면 <code>8 500</code><br>'+
    '<b>길이</b> — 부지 범례 <code>45.0 m</code> / AC-3 축 ①–② <code>36 000</code> / AC-5·6 외곽 <code>37 200</code><br><br>'+

 {id:'09',sv:'a',t:'로후르-0의 표고 주석이 잔존 — 두 도면의 공통 원본', cam:[18,-1,3,40],

    '로후르-0에서는 건축과 기계가 서로 다른 건물을 그린 셈이 된다.'},
 {id:'10',sv:'b',t:'TX-10 "양수장 평면도"는 다른 건물', cam:[-21,1,24.7,34], layer:'ghost', mode:'cf',

 {id:'11',sv:'b',t:'지붕 파형강판 483.60 m² — 기하 형상과 불일치', cam:[18,4,3,44], layer:'roof',
  p:'AC-6 사양서는 지붕층 파형강판(두께 0.05 mm)을 <code>483.60 m²</code>로 계상한다. 그러나 외곽 <code>37.2 × 7.6</code>, 경사 <code>i = 30°</code>로 산정하면 '+

 {sec:'C. 기계 · 관로'},
 {id:'12',sv:'a',t:'펌프 축 중심이 전실 최고수위와 40 mm 차 · 자흡 설비 없음', cam:[14,-2,6,20], layer:'mech',
  p:'축 중심 = 바닥 <code>-2.10</code> + 기초 돌출 <code>0.35</code> + <code>h = 600</code>(TX-6) = <span class="z">-1.15</span> (절대 732.00 m)<br>'+

 {id:'13',sv:'a',t:'NPSH 여유 부족 — 표고 733 m 대기압 저하', cam:[14,-2,6,20], layer:'mech',
  p:'표고 733 m의 대기압은 <code>92.8 kPa = 9.48 mH₂O</code>로 해수면(10.35)보다 <code>0.87 m</code> 낮다.<br><br>'+
    '최고수위·손실 제외 조건에서 <code>NPSHa ≈ 9.28 m</code>, №1~3의 <code>NPSHr = 7.9 m</code>(TX-6) → <b>여유 1.38 m</b>. '+
    '여기서 흡입관 Ø1000 × 52 m, 동심리듀서, 협잡물제거스크린 4개의 손실을 빼면 여유가 <span class="z">1 m 미만</span>으로 남는다. 최저수위 조건에서는 음수가 될 수 있다.<br><br>'+
    '№4는 <code>NPSHr = 4.2 m</code>로 상대적으로 여유가 있다. 최저 운전수위를 명시한 <b>NPSH 검토서</b>가 필요하다.'},
 {id:'14',sv:'a',t:'펌프 플랜지 구경과 관부속 구경 불일치', cam:[14.3,-1,4.5,16], layer:'mech',
  p:'<b>펌프 플랜지</b>(TX-6 · TX-8) — №1~3 흡입 DN1 <code>Ø800</code> / 토출 DN2 <code>Ø700</code>, №4 흡입 <code>Ø700</code> / 토출 <code>Ø600</code><br>'+
    '<b>사양서 관부속</b>(TX-12) — 흡입 동심리듀서 <code>Dy 800×1000</code> 4개, 가압 리듀서 <code>Dy 600×1000</code> 4개, 게이트밸브 <code>Ø600</code> 4개, 신축이음 <code>Dy 600</code> 4개<br><br>'+
    '· №1~3 토출 <b>Ø700 ↔ Ø600</b> : 700→600 축소 부재가 없다<br>'+
    '· №4 흡입 <b>Ø700 ↔ 800</b> : 800→700 축소 부재가 없다<br><br>'+
    '관부속이 4개씩 균일 계상되어 <b>№4가 다른 기종임이 반영되지 않았다</b>. 게이트밸브 Ø600에서 №1~3의 유속은 <code>5.09 m/s</code>로 밸브 상시 통과 유속으로는 높다.'},
 {id:'15',sv:'a',t:'기초 1종으로 이기종 2종 대응 · 앵커 규격 상이', cam:[21.85,-2,1.6,14], layer:'sub',
  p:'TX-9는 기초 <code>4 565 × 2 000</code> 1종을 <b>4개소 전부</b>에 적용한다. 앵커 배치는 <code>400+1 882.5+1 882.5+400</code> / 폭 <code>200+1 600+200</code>, 볼트 <code>M30×600 6개</code>다.<br><br>'+
    '· №1~3 프레임 <code>L0 = 4 800</code> → 기초보다 <span class="z">235 mm 길다</span>, A0 2 000 / B0 2 400, 볼트 <code>M36×600</code><br>'+
    '· №4 프레임 <code>L0 = 5 000</code> → 기초보다 <span class="z">435 mm 길다</span>, A0 1 800 / B0 2 500, 볼트 <code>36×600</code><br><br>'+
    '프레임이 기초보다 길고, 앵커 스팬(1 600 × 3 765)이 A0·B0와 맞지 않으며, <b>볼트가 M30 vs M36으로 다르다</b>. '+
    '기존 기초 철거는 <code>2.30×4.9×1.0 = 11.27 ㎥ × 4 = 45.0 ㎥</code>로 정합하나, 신설 기초는 №4용 별도 도면이 없다.'},
 {id:'16',sv:'b',t:'펌프 임펠러 직경이 도면·사양서에서 다름', cam:[14.3,-1,1.6,18], layer:'mech',
  p:'<b>№1~3</b> — 설치도(TX-6) 표 <code>625 mm</code> / 도면 표제 <code>KQSN800-M17S-625</code> / 설비 사양서(TX-12) <code>Dk = 615.8 mm</code>. 유량도 <code>5 769</code> vs <code>5 184 m³/h</code>, 양정 <code>49</code> vs <code>50 m</code>로 다르다.<br><br>'+

    '사양서의 <code>615.8 / 5 184 / 50</code>은 로후르-0 사양서와 동일한 값이어서, 사양서가 갱신되지 않은 것으로 보인다. '+
    '한편 세트 중량은 №1~3 <code>3 848+7 850 = 11 698</code>, №4 <code>5 402+4 500 = 9 902 kg</code>으로 정합한다.'},
 {id:'17',sv:'b',t:'철거 물량 중량이 로후르-0과 소수점까지 동일', cam:[18,-1,3,40],
  p:'TX-4 철거공사 물량내역서의 중량 <code>26 298.0 / 19 500.0 / 4 960.0 / 3 350.0 kg</code> 네 값이 '+

    '다만 계상 단위가 다르다. 로후르-0은 "펌프-전동기 세트(2대)"였고 로후르-1은 "펌프 3개" / "전동기 3개"로 분리되어 있다. '+
    '즉 <b>같은 숫자가 서로 다른 의미로 쓰였다</b>. 기존 기종도 로후르-1은 <code>Д6300-80(24НДс)</code>·<code>Д4000-95(22НДс)</code>, '+
    '로후르-0은 <code>D2600-80</code>·<code>D4000-85</code>·<code>D4500-90</code>으로 다르다. 현황 실측에 근거한 철거 물량 재산정이 필요하다.'},
 {id:'18',sv:'b',t:'가압송수관 2계열 합류 · 저수조 도면 미제출', cam:[18,0,-9,40], layer:'site',
  p:'부지 범례는 가압송수관을 <code>D=1000 mm 4계열, 34.0 m</code>(건물~연결점)에서 <code>D=1000 mm 2계열, 542.0 m</code>(연결점~가압저수조)로 계상한다.<br><br>'+
    '총유량 <code>5 184×3 + 3 600 = 19 152 m³/h = 5.32 m³/s</code>로 산정하면 유속이 4계열 <code>1.67 m/s</code> → 2계열 <span class="z">3.35 m/s</span>가 된다. '+
    '2계열 구간의 마찰손실·수격압 검토와 <b>연결점(합류부) 상세</b>가 필요하다.<br><br>'+

 {id:'19',sv:'a',t:'변전소 치수 4종 · 축 번호 체계 3종', cam:[-3.2,2,-1,26], mode:'sub', layer:'trafo',

}

  e.innerHTML='<b>3D 뷰포트를 초기화하지 못했습니다.</b><br>'+(err&&err.message?err.message:String(err))+

  if(v) v.appendChild(e);
  if(window.console) console.error(err);
}

</script>
